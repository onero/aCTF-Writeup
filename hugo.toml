baseURL = 'https://ctf.adamino.dk/'
languageCode = 'en-us'
title = 'Adamino CTF Writeups'
theme = 'hermit-v2'
ignoreFiles = ["README.md", "README"]
ignoreLogs = ['warning-goldmark-raw-html']

defaultContentLanguage = "en"
copyright = "Adamino 2023"
# googleAnalytics = "UA-123-451"

# Syntax highlighting: emit CSS classes (styled by the theme's _syntax.scss) instead of
# inline styles, so code-block colours stay consistent and the rendered HTML is smaller.
[markup]
  [markup.highlight]
    noClasses = false

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  dateform        = "2 Jan, 2006"
  dateformShort   = "2 Jan"
  dateformNum     = "02-01-2006"
  dateformNumTime = "15:04 02-01-2006 -0700"

  bgImg = "aCTF.webp"

  # Brand accent (overrides the theme's default green). Honored by the theme's style.scss.
  accentColor = "#0077b6"

  # Pin Mermaid to a fixed version so the build/runtime never pulls "latest" from the CDN.
  mermaidLib = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs"

  # Show estimated read time (+ word count) on write-up pages.
  readTime = true
  readTimeSeparator = " · "

  scrollToTop = true
  footerCopyright = "The quieter you become the more you are able to hear"


[params.author]
  name = "Adamino"
  about = ""


[languages]
  [languages.en]
    title = 'Adamino CTF Writeups'
    [languages.en.params]
    
  [[params.socialLinks]]
    name = "github"
    url = "https://github.com/onero"

[menu]

  [[menu.main]]
    name = "Tools"
    url = "tools/"
    weight = 2

  [[menu.main]]
    name = "NC3"
    url = "nc3/"
    weight = 10

  [[menu.main]]
    name = "Brunner"
    url = "brunner/"
    weight = 11
